# Windows XP Luna theme (light and dark use the same palette).
name = "Windows XP Luna"

[light]
  primary = "#0053EE"
  link = "#0000FF"
  link_hover = "#000080"
  background = "#3A6EA5"
  # Menu / taskbar
  menu_primary = "#245EDC"
  menu_text = "#FFFFFF"
  menu_text_active = "#FFFFFF"
  menu_title = "#FFFFFF"
  # Home sections (window face)
  home_section_odd = "#ECE9D8"
  home_section_even = "#ECE9D8"

[dark]
  primary = "#0053EE"
  link = "#0000FF"
  link_hover = "#000080"
  background = "#3A6EA5"
  menu_primary = "#245EDC"
  menu_text = "#FFFFFF"
  menu_text_active = "#FFFFFF"
  menu_title = "#FFFFFF"
  home_section_odd = "#ECE9D8"
  home_section_even = "#ECE9D8"
